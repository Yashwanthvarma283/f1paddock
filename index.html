    <!-- Pre-paint Flash Prevention: detect & apply theme before first paint -->
    <script>
      (function() {
        try {
          var key = 'f1paddock_theme_mode';
          var stored = localStorage.getItem(key) || localStorage.getItem('pitwall_theme_mode');
          var theme = null;
          if (stored) {
            try { theme = JSON.parse(stored); } catch(e) { theme = stored; }
          }
          if (theme !== 'dark' && theme !== 'light') {
            theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
          }
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
